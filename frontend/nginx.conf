upstream backend {
    server backend:8000;
    keepalive 16;
}

# Protected media is NEVER reachable from outside; only via X-Accel-Redirect
# from the Django /media/<id>/ view. Nginx Proxy Manager in front of this
# container does not proxy /protected-media (it doesn't know the path).
#
# Request flow for an attachment:
#   browser  →  NPM  →  web (this nginx)  →  /api/media/<id>/  →  backend
#   backend checks permissions, replies X-Accel-Redirect: /protected-media/<path>
#   web nginx serves the file from /var/www/media.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    # Service workers must not be cached.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Static SPA assets with long cache.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
    }

    # Internal only — target of X-Accel-Redirect from Django.
    location /protected-media/ {
        internal;
        alias /var/www/media/;
        add_header Cache-Control "private, no-store" always;
    }

    # API — streaming-friendly.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE: stream to the client immediately.
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
