name: home-dashboard

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  volumes:
    - media:/app/media
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-file-per-table=1
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend-base
    # Brings the database up to date (and the default roles) before serving,
    # so a fresh install needs no shell: open the app and run first setup.
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py seed_roles &&
        exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips '*'
    expose: ["8000"]

  worker:
    <<: *backend-base
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]

  beat:
    <<: *backend-base
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]

  slackbot:
    <<: *backend-base
    command: ["python", "manage.py", "run_slackbot"]
    profiles: ["slack"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    volumes:
      - media:/var/www/media:ro
    # Only this port is published; Nginx Proxy Manager targets it.
    # Bind to the LAN IP of the NAS in production (edit WEB_BIND).
    ports:
      - "${WEB_BIND:-127.0.0.1}:8080:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:11434:11434"
    restart: unless-stopped

  backup:
    image: alpine:3.20
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/media:ro
      - ./ops/backup:/ops:ro
      - ${BACKUP_HOST_DIR:-./data/backups}:/backups
    entrypoint: ["/bin/sh", "/ops/entrypoint.sh"]
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  media:
  ollama-data:
